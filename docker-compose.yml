version: '3.8'

services:
  postgres:
    # Fixação estrita no Postgres 16 com pgvector oficial
    image: pgvector/pgvector:pg16
    container_name: grimoire_db
    environment:
      POSTGRES_USER: grimoire_admin
      POSTGRES_PASSWORD: grimoire_secure_password
      POSTGRES_DB: grimoire_core
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire_admin -d grimoire_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: grimoire_event_bus
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Restauração do LocalAI conforme escopo original da Fase 1
  localai:
    image: quay.io/go-skynet/local-ai:latest
    container_name: grimoire_localai
    ports:
      - "8080:8080"
    environment:
      - MODELS_PATH=/models
      # Preload do modelo de embeddings bge-large na inicialização
      - PRELOAD_MODELS=[{"url": "github:go-skynet/model-gallery/base.yaml", "name": "bge-large"}]
    volumes:
      - localai_models:/models

  opendataloader:
    image: adithyask/marker-api:latest
    container_name: grimoire_pdf_extractor
    ports:
      - "8000:8000"
    environment:
      - WORKERS=2
      - MIN_LENGTH=10
    volumes:
      - marker_models:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  pgdata:
  redisdata:
  localai_models:
  marker_models:
